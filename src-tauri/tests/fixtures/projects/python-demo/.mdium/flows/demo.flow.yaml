schemaVersion: 1
id: demo
name: Python demo flow
params:
  a: { type: number, default: 2 }
nodes:
  - { id: add, kind: python, runtime: demo, entry: demo.add, with: { a: "${{ params.a }}", b: 1 } }
  - { id: ask, kind: python, runtime: demo, entry: demo.ask }
edges:
  - { from: add, to: ask }
outputs:
  sum: "${{ nodes.add.outputs.sum }}"
